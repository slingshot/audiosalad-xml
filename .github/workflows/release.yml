name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Version or publish
    # NOT namespace-profile-default, unlike every other job in this repo.
    # npm rejects a provenance bundle built on a self-hosted runner:
    #   "Unsupported GitHub Actions runner environment: self-hosted.
    #    Only github-hosted runners are supported when publishing with
    #    provenance."
    # Namespace runners register as self-hosted, and Trusted Publishing always
    # attaches provenance, so this job must run on a GitHub-hosted runner.
    # The toolchain still comes from mise.toml, so it matches CI exactly.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@v4
        with:
          version: 2026.8.16
          cache: true

      # Publishing uses npm Trusted Publishing (OIDC) — no token, no .npmrc.
      # npm exchanges the `id-token: write` credential below for a short-lived
      # publish token and attaches provenance automatically. npm's CLI is what
      # publishes even though bun manages dependencies; it comes from the node
      # pinned in mise.toml (npm 11.17.0, above the 11.5.1 OIDC floor), so the
      # publish runs on the same toolchain as the build.
      - run: bun install --frozen-lockfile

      # Publishing must not race CI. The full gate runs here so a failing test,
      # typecheck, XSD validation, or export check blocks the publish itself.
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun test
      - name: Build
        run: bun run build
      - name: Bundle size budget
        run: bun run size
      - name: Validate published package
        run: bun run check:exports

      - name: Create a version PR or publish
        uses: changesets/action@v1
        with:
          version: bun run version
          publish: bun run release
          title: 'chore(release): version packages'
          commit: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
